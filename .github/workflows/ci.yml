name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # package-lock.json 目前缺少 resolved/integrity，npm ci 会拒绝，先用 install。
      # 本地跑一次 `npm install` 让锁文件补齐后，这里可以换回 `npm ci`。
      - run: npm install --no-audit --no-fund
      - run: npm run compile
      - run: npm run check
      - run: npm test

  package:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run package:vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
          retention-days: 30

  release:
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: vsix
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" *.vsix --clobber
          else
            gh release create "$TAG" *.vsix --title "$TAG" --notes "Automated build from the main branch."
          fi
